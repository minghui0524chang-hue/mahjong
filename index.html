 function sort(h){h.sort((a,b)=>a-b)}function win(h,groups){if(h.length!==groups*3+2)return false;let c=Array(34).fill(0);h.forEach(x=>c[x]++);function dfs(n){if(!n)return c.every(x=>!x);let i=c.findIndex(x=>x);if(i<0)return false;if(c[i]>=3){c[i]-=3;if(dfs(n-1))return true;c[i]+=3}if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;if(dfs(n-1))return true;c[i]++;c[i+1]++;c[i+2]++}return false}for(let i=0;i<34;i++)if(c[i]>=2){c[i]-=2;if(dfs(groups))return true;c[i]+=2}return false}function isWin(p,extra=null){return win(extra===null?hands[p]:hands[p].concat(extra),5-melds[p].length)}function quality(h){let c=Array(34).fill(0),v=0;h.forEach(t=>c[t]++);for(let i=0;i<34;i++){if(c[i]>=2)v+=3;if(c[i]>=3)v+=3;if(i<27){if(i%9<8&&c[i]&&c[i+1])v+=2.5;if(i%9<7&&c[i]&&c[i+2])v+=1.1}else if(c[i]===1)v-=.6}return v}function choose(h){let best=0,b=-1e9;for(let i=0;i<h.length;i++){let c=h.slice();c.splice(i,1);let s=quality(c)+Math.random()*.15;if(s>b){b=s;best=i}}return best}function count(h,t){return h.filter(x=>x===t).length}function remove(h,t,n){for(let i=0;i<n;i++)h.splice(h.indexOf(t),1)}function tileGroup(target,tiles){let wrap=document.createElement('span');wrap.style.display='inline-flex';wrap.style.gap='1px';tiles.forEach(t=>wrap.append(el(t,true)));target.append(wrap)}function render(){for(let p=0;p<4;p++){let r=$('r'+p);r.replaceChildren();let cr=$('center-r'+p);if(cr)cr.replaceChildren(...rivers[p].slice(-18).map(t=>el(t,true)));let m=$('m'+p);m.replaceChildren();melds[p].forEach(g=>tileGroup(m,g.tiles));if(p){$('n'+p).textContent=hands[p].length+'張';$('b'+p).replaceChildren(...Array.from({length:Math.min(16,hands[p].length)},()=>{let d=document.createElement('div');d.className='back';return d}))}}let h=$('hand');h.replaceChildren();hands[0].forEach((t,i)=>{let x=el(t);if(i===selected)x.classList.add('selected');x.onclick=()=>{if(turn!==0||phase!=='discard')return;selected=i;render()};h.append(x)});$('mycount').textContent=hands[0].length+'張';$('stats').textContent='剩餘 '+wall.length+'｜勝 '+wins;$('draw').disabled=phase!=='draw'||turn!==0;$('discard').disabled=phase!=='discard'||turn!==0||selected<0;$('win').disabled=!(turn===0&&phase==='discard'&&isWin(0));$('kong').disabled=!(turn===0&&phase==='discard'&&possibleKongs(0).length);$('sort').disabled=phase==='idle'||phase==='over';$('help').disabled=phase==='idle'||phase==='over'}function msg(s){$('notice').textContent=s}function finish(p,from=-1){phase='over';generation++;if(delay)clearTimeout(delay);if(p===0)wins++;$('result').textContent=p<0?'流局':p===0?'恭喜！你胡牌了！':'電腦 '+['','A','B','C'][p]+' 胡牌';$('detail').textContent='本局結束，按下方按鈕開始下一局。'+(p>=0?(settle(p,from)||''):'');$('overlay').style.display='flex';say(p<0?'流局':p===0?'自摸啦！胡牌！':'胡牌啦！',p<0?0:p);render()}function draw(p){if(!wall.length){finish(-1);return false}hands[p].push(wall.pop());sort(hands[p]);if(isWin(p)){if(p===0){phase='discard';msg('你自摸了！按胡牌');say('自摸！');render()}else finish(p);return false}return true}function possibleKongs(p){let a=[];for(let t=0;t<34;t++){if(count(hands[p],t)===4)a.push({t,kind:'concealed'});if(count(hands[p],t)===1&&melds[p].some(m=>m.kind==='pong'&&m.tiles[0]===t))a.push({t,kind:'added'})}return a}function performKong(p,k){if(k.kind==='concealed'){remove(hands[p],k.t,4);melds[p].push({kind:'kong',tiles:[k.t,k.t,k.t,k.t]})}else{remove(hands[p],k.t,1);let m=melds[p].find(m=>m.kind==='pong'&&m.tiles[0]===k.t);m.kind='kong';m.tiles.push(k.t)}say(p?'槓啦！':'槓',p);msg((p?'電腦槓牌':'你槓牌')+' '+nm(k.t));if(!wall.length){finish(-1);return}hands[p].push(wall.pop());sort(hands[p]);if(isWin(p)){if(p===0){phase='discard';msg('槓上開花！按胡牌');say('自摸');render()}else finish(p);return}if(p===0){phase='discard';selected=-1;render()}else aiDiscard(p)}function afterDiscard(p,t){rivers[p].push(t);lastDiscard={p,t};say(nm(t),p,p!==0);msg((p?'電腦 '+['','A','B','C'][p]:'你')+' 打出 '+nm(t));render();resolveClaims(p,t)}function resolveClaims(p,t){let order=[1,2,3].map(d=>(p+d)%4);let winners=order.filter(q=>isWin(q,t));if(winne g'?'槓':'碰')+'牌，請出牌');render()}else aiDiscard(p)}function autoClaim(p,t,pong,kong){let order=[1,2,3].map(d=>(p+d)%4);let q=order.find(q=>q!==0&&(kong.includes(q)||pong.includes(q)));if(q!==undefined){let type=kong.includes(q)?'kong':'pong';takeClaim({type,p:q,t});return}advance(p)}function advance(p){turn=(p+1)%4;phase=turn===0?'draw':'ai';selected=-1;render();if(turn===0){msg('輪到你了，請摸牌');say('輪到你了')}else{const token=generation;delay=setTimeout(()=>{if(token===generation)aiTurn()},Number($('pace').value))}}function aiDiscard(p){const token=generation;phase='ai';delay=setTimeout(()=>{if(token!==generation||phase==='over')return;let i=choose(hands[p]),t=hands[p].splice(i,1)[0];afterDiscard(p,t)},Math.max(450,Math.round(Number($('pace').value)*.65)))}function aiTurn(){if(phase==='over'||turn===0)return;let p=turn;if(!draw(p))return;let k=possibleKongs(p);if(k.length&&Math.random()<.35){performKong(p,k[0]);return}aiDiscard(p)}function newGame(){settled=false;generation++;if(delay)clearTimeout(delay);$('overlay').style.display='none';$('claim').replaceChildren();let deck=[];for(let t=0;t<34;t++)for(let k=0;k<4;k++)deck.push(t);for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}hands=[[],[],[],[]];rivers=[[],[],[],[]];melds=[[],[],[],[]];for(let k=0;k<16;k++)for(let p=0;p<4;p++)hands[p].push(deck.pop());hands[0].push(deck.pop());hands.forEach(sort);wall=deck;selected=-1;turn=0;phase='discard';msg('新局開始，你先打出一張牌');spokenCounter=[0,0,0,0];if('speechSynthesis'in window)speechSynthesis.cancel();say('新局開始，請出牌');$('hint').textContent='';render()}$('new').onclick=newGame;$('draw').onclick=()=>{if(phase!=='draw'||turn!==0)return;if(draw(0)){phase='discard';msg('請選擇一張牌打出');say('請出牌')}render()};$('discard').onclick=()=>{if(phase!=='discard'||turn!==0||selected<0)return;let t=hands[0].splice(selected,1)[0];selected=-1;phase='ai';afterDiscard(0,t)};$('win').onclick=()=>{if(turn===0&&phase==='discard'&&isWin(0))finish(0)};$('kong').onclick=()=>{let k=possibleKongs(0);if(k.length)performKong(0,k[0])};$('sort').onclick=()=>{sort(hands[0]);selected=-1;render()};$('help').onclick=()=>{let h=hands[0],res=[];if(phase==='discard'){for(let i=0;i<h.length;i++){let a=h.slice();let d=a.splice(i,1)[0],wait=[];for(let t=0;t<34;t++)if(isWinWith(a,t))wait.push(nm(t));if(wait.length)res.push(nm(d)+'→'+wait.join('、'))}}else{let wait=[];for(let t=0;t<34;t++)if(isWinWith(h,t))wait.push(nm(t));if(wait.length)res.push(wait.join('、'))}$('hint').textContent=res.length?'聽牌：'+res.slice(0,4).join('；'):'目前沒有直接聽牌';function isWinWith(a,t){return win(a.concat(t),5-melds[0].length)}};$('stake').onchange=()=>{if(confirm('切換底/台將重設四家的起始籌碼，是否繼續？')){resetBank();newGame()}else $('stake').value=$('stake').dataset.old||'100,50'};$('stake').addEventListener('focus',()=>{$('stake').dataset.old=$('stake').value});resetBank();$('pace').onchange=()=>{msg('已調整電腦出牌速度：'+$('pace').selectedOptions[0].textContent)};$('sound').onclick=()=>{voice=!voice;$('sound').textContent=voice?'🔊 語音開':'🔇 語音關';if(voice)say('語音已開啟')};newGame();
