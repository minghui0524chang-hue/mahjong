// V6.10: Real GLB/glTF character loader. Geometry fallback is hidden only after a valid 3D model loads.
const loadedAvatars=Array(4).fill(null);
function loadRealAvatar(seat,file){
 if(!file)return Promise.reject(new Error('未選擇 GLB 模型'));
 if(!T.GLTFLoader)return Promise.reject(new Error('GLTFLoader 尚未載入，請確認網路'));
 return new Promise((resolve,reject)=>{
  const url=URL.createObjectURL(file);
  new T.GLTFLoader().load(url,(gltf)=>{
   URL.revokeObjectURL(url);
   try{
    const model=gltf.scene;
    const bounds=new T.Box3().setFromObject(model),size=bounds.getSize(new T.Vector3());
    if(size.y<.01)throw Error('模型高度不正確');
    const scale=2.6/size.y;model.scale.setScalar(scale);
    const scaled=new T.Box3().setFromObject(model),center=scaled.getCenter(new T.Vector3());
    model.position.set(-center.x, .26-scaled.min.y,-center.z);
    if(loadedAvatars[seat])characterGroups[seat].remove(loadedAvatars[seat]);
    characterGroups[seat].add(model);loadedAvatars[seat]=model;
    characterBodyParts[seat].forEach(o=>o.visible=false);
    if(portraits[seat])portraits[seat].visible=false;
    model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
    resolve(gltf);
   }catch(err){reject(err)}
  },undefined,err=>{URL.revokeObjectURL(url);reject(err)});
 });
}
const CHARACTER_KEY='mahjong_v63_four_characters';
const labels=['你（玩家）','電腦 A（對家）','電腦 B（上家）','電腦 C（下家）'];
// Each seat owns its own record; changing one seat never overwrites another.
const characters=Array.from({length:4},(_,seat)=>({name:labels[seat],photo:''}));
// V6.9: all four seats start with 3D Asian adult characters; photos remain optional.
characters.forEach((c,i)=>c.name=['亞洲男性・深藍襯衫','亞洲女性・酒紅上衣','亞洲男性・墨綠襯衫','亞洲女性・米金上衣'][i]);
try{
 const previous=JSON.parse(localStorage.getItem(CHARACTER_KEY)||'null');
 if(Array.isArray(previous))previous.slice(0,4).forEach((v,i)=>{if(v&&typeof v==='object')characters[i]={name:String(v.name||labels[i]),photo:typeof v.photo==='string'?v.photo:''}});
 else {
  const old=JSON.parse(localStorage.getItem('mahjong_v61_character')||'null');
  if(old&&Number.isInteger(old.seat)&&old.seat>=0&&old.seat<4){characters[old.seat]={name:old.name||labels[old.seat],photo:old.photo||''}}
 }
}catch(e){console.warn('讀取角色設定失敗',e)}
let activeSeat=1, pendingPhoto=null;
// V6.9: photographs are never rendered as flat billboards. Each avatar stays a 3D mesh.
// A photograph can optionally texture a curved 3D face shell; this is not a scanned likeness.
const portraits=Array(4).fill(null);
function applyCharacter(seat){
 const old=portraits[seat];if(old){old.parent?.remove(old);old.geometry?.dispose();old.material.map?.dispose();old.material.dispose();portraits[seat]=null}
 if(!loadedAvatars[seat])characterBodyParts[seat].forEach(part=>part.visible=true);
 const cfg=characters[seat];if(!cfg.photo)return;
 const image=new Image(),currentPhoto=cfg.photo;
 image.onload=()=>{
  if(characters[seat].photo!==currentPhoto)return;
  const c=document.createElement('canvas');c.width=512;c.height=512;
  const ctx=c.getContext('2d');ctx.fillStyle='#d7a583';ctx.fillRect(0,0,512,512);
  const iw=image.naturalWidth,ih=image.naturalHeight;
  const sc=Math.max(512/iw,512/ih);ctx.drawImage(image,(512-iw*sc)/2,(512-ih*sc)/2,iw*sc,ih*sc);
  const tx=new T.CanvasTexture(c);tx.colorSpace=T.SRGBColorSpace;
  // A real curved mesh follows the front of the volumetric head (not a Sprite or Plane).
  const geo=new T.SphereGeometry(1,40,24,Math.PI*.27,Math.PI*.46,Math.PI*.17,Math.PI*.66);
  const mesh=new T.Mesh(geo,new T.MeshStandardMaterial({map:tx,roughness:.92,side:T.DoubleSide,transparent:false}));
  mesh.scale.set(.298,.366,.273);mesh.position.set(0,2.43,-.09);
  mesh.rotation.y=Math.PI;
  characterGroups[seat].add(mesh);portraits[seat]=mesh;
 };
 image.onerror=()=>console.warn('照片載入失敗',seat);image.src=currentPhoto;
}
function refreshCharacterForm(){

 const prev=document.getElementById('charPreview');prev.src=pendingPhoto||c.photo||'';prev.style.visibility=(pendingPhoto||c.photo)?'visible':'hidden';
 document.getElementById('character-seat-status').textContent=labels[activeSeat]+'：'+(c.photo?'已設定照片':'尚未設定照片');
 document.getElementById('charPhoto').value='';
}
const characterUI=document.createElement('div');characterUI.id='character-ui';characterUI.innerHTML=`<button type="button" id="charToggle">人物設定</button><div id="charPanel" hidden><strong>V6.9｜四位立體人物（非照片立牌）</strong><label>選擇要編輯的座位<select id="charSeat"><option value="0">你（玩家）</option><option value="1">電腦 A（對家）</option><option value="2">電腦 B（上家）</option><option value="3">電腦 C（下家）</option></select></label><label>角色名稱<input id="charTitle" maxlength="30"></label><label>上傳真正 3D 人物模型（GLB／glTF）<input id="charGLB" type="file" accept=".glb,.gltf,model/gltf-binary"></label><div id="charModelStatus" style="font-size:12px;color:#ffe1a1">尚未載入 GLB：顯示原有簡化人物</div><label>人物照片（僅供原有功能）<input id="charPhoto" type="file" accept="image/*"></label><img id="charPreview" alt="座位照片預覽" style="width:100px;height:110px;object-fit:cover;border-radius:9px;border:2px solid #b99052;justify-self:center"><div id="character-seat-status"></div><small>每個座位的照片分開保存。變更電腦 B 不會移除電腦 A。預設為四位不同的立體亞洲人物。若上傳照片，會將影像貼合至立體頭部曲面，不再出現懸浮照片。這是 3D 曲面貼圖，並非真人掃描或精確的照片轉 3D。</small><button type="button" id="charSave">儲存這個座位</button><button type="button" id="charClose">關閉</button></div>`;
document.body.append(characterUI);
document.getElementById('charToggle').onclick=()=>{const p=document.getElementById('charPanel');p.hidden=!p.hidden;if(!p.hidden)refreshCharacterForm()};
document.getElementById('charGLB').onchange=async e=>{
 const f=e.target.files?.[0];if(!f)return;
 const el=document.getElementById('charModelStatus');el.textContent='載入 3D 模型中…';
 try{await loadRealAvatar(activeSeat,f);el.textContent='已載入真正的 3D 模型：'+f.name+'（重新整理後需重新載入）'}
 catch(err){el.textContent='載入失敗：'+(err?.message||err);console.error(err)}
};
document.getElementById('charClose').onclick=()=>document.getElementById('charPanel').hidden=true;
document.getElementById('charSeat').onchange=e=>{activeSeat=Number(e.target.value);pendingPhoto=null;refreshCharacterForm()};
document.getElementById('charPhoto').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){alert('請選擇圖片');return}const img=new Image();const url=URL.createObjectURL(f);img.onload=()=>{const c=document.createElement('canvas');const scale=Math.min(1,650/img.width,650/img.height);c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);pendingPhoto=c.toDataURL('image/jpeg',.76);document.getElementById('charPreview').src=pendingPhoto;document.getElementById('charPreview').style.visibility='visible';URL.revokeObjectURL(url)};img.onerror=()=>URL.revokeObjectURL(url);img.src=url};
document.getElementById('charSave').onclick=()=>{
 const cfg=characters[activeSeat];cfg.name=document.getElementById('charTitle').value.trim()||labels[activeSeat];if(pendingPhoto)cfg.photo=pendingPhoto;
 try{localStorage.setItem(CHARACTER_KEY,JSON.stringify(characters))}catch(e){alert('照片儲存空間不足，請使用較小的照片');console.warn(e)}
 applyCharacter(activeSeat);pendingPhoto=null;refreshCharacterForm();document.getElementById('charPanel').hidden=true;
};
characters.forEach((_,i)=>applyCharacter(i));refreshCharacterForm();

// A compact 2D discard/meld overview remains readable even in perspective view.
const riverPanel=document.createElement('aside');riverPanel.id='riverOverview';riverPanel.innerHTML='<button id="riverToggle" type="button">四家牌區 ▾</button><div id="riverContent"><div class="rv"><b>對家 A</b><div id="rv1"></div></div><div class="rv"><b>上家 B</b><div id="rv2"></div></div><div class="rv"><b>下家 C</b><div id="rv3"></div></div><div class="rv"><b>你</b><div id="rv0"></div></div></div>';
document.body.append(riverPanel);
document.getElementById('riverContent').hidden=true;document.getElementById('riverToggle').textContent='四家牌區 ▸';
document.getElementById('riverToggle').onclick=()=>{const el=document.getElementById('riverContent');el.hidden=!el.hidden;document.getElementById('riverToggle').textContent=el.hidden?'四家牌區 ▸':'四家牌區 ▾'};
function updateRiverOverview(){
 for(let i=0;i<4;i++){
  const to=document.getElementById('rv'+i);if(!to)continue;
  to.replaceChildren();
  const discards=(typeof rivers!=='undefined'&&rivers[i])||[];
  if(discards.length){discards.forEach(t=>to.appendChild(el(t,true)))}
  else {const empty=document.createElement('span');empty.className='empty-river';empty.textContent='尚無棄牌';to.appendChild(empty)}
  const groups=(typeof melds!=='undefined'&&melds[i])||[];
  if(groups.length){const row=document.createElement('div');row.className='meld-row';const label=document.createElement('span');label.className='meld-label';label.textContent='公開組合（吃／碰／槓）';row.appendChild(label);
   groups.forEach((group,j)=>{if(j){const sep=document.createElement('span');sep.textContent='｜';row.appendChild(sep)}(group.tiles||[]).forEach(t=>row.appendChild(el(t,true)))});to.appendChild(row)}
 }
}
// Tea tables and decoration.
for(let x of [-6.0,6.0]){cyl(.58,.58,.075,wood,x,.82,2);cyl(.07,.07,.78,trim,x,.4,2);cyl(.16,.16,.18,mat(0xe8ded0),x,1,2)}
// 3D tile geometry and 2D tile art as canvas texture.
const white=mat(0xf8f1db,.34),green=mat(0x075535,.35);let tileObjects=[];const textureCache={};
function faceTexture(t){if(textureCache[t])return textureCache[t];let c=document.createElement('canvas');c.width=128;c.height=176;let cx=c.getContext('2d');cx.fillStyle='#fffcf0';cx.fillRect(0,0,128,176);cx.textAlign='center';cx.textBaseline='middle';if(t<9){cx.fillStyle='#15468c';cx.font='bold 84px serif';cx.fillText('一二三四五六七八九'[t],64,66);cx.fillStyle='#b62c25';cx.font='bold 66px serif';cx.fillText('萬',64,133)}else if(t<18){let n=t-8;for(let j=0;j<n;j++){let col=Math.min(n,3),rows=Math.ceil(n/col),x=64+(j%col-(col-1)/2)*31,y=88+(Math.floor(j/col)-(rows-1)/2)*35;cx.beginPath();cx.arc(x,y,11,0,Math.PI*2);cx.lineWidth=4;cx.strokeStyle=j%3===1?'#bb3434':'#165ca0';cx.stroke();cx.beginPath();cx.arc(x,y,4,0,Math.PI*2);cx.fillStyle='#1b8461';cx.fill()}}else if(t<27){let n=t-17;for(let j=0;j<n;j++){let col=Math.min(n,3),rows=Math.ceil(n/col),x=64+(j%col-(col-1)/2)*31,y=88+(Math.floor(j/col)-(rows-1)/2)*34;cx.strokeStyle=j%3===1?'#bb3535':'#17824c';cx.lineWidth=7;cx.lineCap='round';cx.beginPath();cx.moveTo(x,y-11);cx.lineTo(x,y+11);cx.stroke()}}else{cx.fillStyle=t===31?'#b31b21':t===32?'#118343':'#173c75';cx.font='bold 95px serif';cx.fillText(['東','南','西','北','中','發','白'][t-27],64,88)}const tx=new T.CanvasTexture(c);tx.colorSpace=T.SRGBColorSpace;textureCache[t]=tx;return tx}
function makeTile(t,x,z,rotation=0,back=false,scale=1,kind='flat',layer=0){
 let g=new T.Group();g.position.set(x,1.725+layer*.135,z);g.rotation.y=rotation;g.scale.setScalar(scale);scene.add(g);
 // Tile has a green backing and an ivory face; concealed hands stand upright facing their owner.
 box(.24,.12,.34,green,0,0,0,g);
 box(.224,.008,.314,back?green:new T.MeshStandardMaterial({map:faceTexture(t),roughness:.75}),0,.066,0,g);
 if(kind==='upright'){
   g.rotation.order='YXZ';g.rotation.x=-Math.PI/2;
   g.position.y=1.84;
 }
 tileObjects.push(g);return g
}
function rebuildTiles(){
 tileObjects.forEach(o=>scene.remove(o));tileObjects=[];if(typeof hands==='undefined')return;
 // Correct tabletop zones: outer wall at +/-2.10; concealed hands at +/-2.38;
 // discards in the four quadrants surrounding the central mechanism.
 for(let side=0;side<4;side++)for(let j=0;j<16;j++)for(let layer=0;layer<2;layer++){
   let p=(j-7.5)*.272;
   let x=side<2?p:(side===2?-2.09:2.09);
   let z=side===0?2.09:side===1?-2.09:p;
   makeTile(0,x,z,side<2?0:Math.PI/2,true,.88,'flat',layer);
 }
 for(let p=0;p<4;p++){
   let arr=hands[p]||[],max=Math.min(arr.length,17);
   for(let j=0;j<max;j++){
     let pos=(j-(max-1)/2)*.273;
     if(p===0)makeTile(arr[j],pos,2.39,0,false,.88,'upright');
     else if(p===1)makeTile(arr[j],-pos,-2.39,Math.PI,true,.88,'upright');
     else if(p===2)makeTile(arr[j],-2.39,pos,-Math.PI/2,true,.88,'upright');
     else makeTile(arr[j],2.39,-pos,Math.PI/2,true,.88,'upright');
   }
   let r=(typeof rivers!=='undefined'&&rivers[p])||[];
   r.slice(-18).forEach((t,j)=>{
     let col=j%6,row=Math.floor(j/6);
     let x=(col-2.5)*.245,z=.64+row*.32;
     if(p===1){x=-x;z=-z}
     else if(p===2){let tmp=x;x=-z;z=tmp}
     else if(p===3){let tmp=x;x=z;z=-tmp}
     makeTile(t,x,z,0,false,.82);
   });
 }
}
let lastSignature='';function sync(){try{let sig=JSON.stringify([hands,rivers,melds,selected,turn,phase]);if(sig!==lastSignature){lastSignature=sig;rebuildTiles();updateRiverOverview()}}catch(e){}}
function resize(){let w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function animate(){requestAnimationFrame(animate);sync();const now=performance.now()*.001;for(const arm of animatedArms){const active=typeof turn!=="undefined"&&turn===arm.seat&&typeof phase!=="undefined"&&phase!=="over";const sway=Math.sin(now*2.7+arm.seat*1.8+arm.side)*.035;arm.fore.position.z=arm.base.z+(active?-.12*Math.max(0,Math.sin(now*2.3)):0)+sway;arm.hand.position.z=arm.handBase.z+(active?-.22*Math.max(0,Math.sin(now*2.3)):0)+sway;arm.fore.rotation.x=-.8+(active?-.22*Math.max(0,Math.sin(now*2.3)):0)}let dest=targets[view];camera.position.lerp(new T.Vector3(...dest.pos),.06);camera.lookAt(...dest.look);renderer.render(scene,camera)}camera.position.set(...targets.room.pos);animate();
document.getElementById('camNear').textContent='俯視牌桌';document.getElementById('camNear').onclick=()=>view='near';document.getElementById('camRoom').onclick=()=>view='room';fallback.remove();
}catch(e){fallback.textContent='3D 場景啟動失敗：'+e.message;console.error(e)}
})();
